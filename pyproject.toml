[project]
name = "lunchmoney-mcp"
version = "0.4.0"
description = "Lunch Money Application"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Justin Flannery", email = "juftin@juftin.com"}
]
license = "MIT"
dependencies = [
  "fastapi[standard]==0.139.2",
  "lunchmoney-python-async==2.25.0",
  "sqlmodel==0.0.39",
  "aiosqlite>=0.22.1,<0.23.0",
  "alembic>=1.18.5,<2",
  "asyncpg>=0.31.0,<0.32.0",
  "fastmcp>=3.4.6,<4",
  "sqlalchemy[asyncio]>=2.0.51,<3",
  "filelock>=3.32.0",
  "redis>=8.0.1",
  "gunicorn>=23.0.0,<24",
  "uvicorn-worker>=0.4.0,<1",
  "apscheduler==3.11.2",
  "typing-extensions>=4.12.2",
  "jinja2>=3.1.6,<4"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython"
]

[project.urls]
Documentation = "https://juftin.github.io/lunchmoney-mcp"
Issues = "https://github.com/juftin/lunchmoney-mcp/issues"
Source = "https://github.com/juftin/lunchmoney-mcp"

[project.scripts]
lunchmoney-mcp = "lunchmoney_mcp.cli:main"

[tool.lunchmoney_contract]
client_package = "lunchmoney-python-async"
client_version = "2.25.0"
openapi_spec_package = "@lunch-money/v2-api-spec"
openapi_spec_version = "2.9.4"

[tool.pytest.ini_options]
addopts = [
  "-v",
  "--cov=src/lunchmoney_mcp",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--junitxml=pytest.xml"
]
markers = [
  "integration: tests that require an external service",
  "upstream_contract: tests that call Lunch Money's official static mock service"
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:"
]

[tool.coverage.run]
branch = true
omit = [
  "src/lunchmoney_mcp/__about__.py"
]
parallel = true

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "lunchmoney.models"
no_implicit_reexport = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["lunchmoney_mcp"]

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[dependency-groups]
dev = [
  "marimo>=0.23.16",
  "mypy>=1,<2",
  "pre-commit>=4.6.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pyyaml==6.0.3",
  "ruff>=0.15.22"
]
docs = [
  "markdown-callouts~=0.4.0",
  "markdown-exec~=1.11.0",
  "mkdocs~=1.6.1",
  "mkdocs-autorefs~=1.4.3",
  "mkdocs-gen-files~=0.5.0",
  "mkdocs-literate-nav~=0.6.2",
  "mkdocs-material>=9.7,<10",
  "mkdocs-section-index~=0.3.10",
  "mkdocstrings[python]~=0.30.0",
  "pymdown-extensions>=11,<12"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
