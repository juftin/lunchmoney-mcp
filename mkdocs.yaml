# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: lunchmoney-mcp
nav:
    - Home: index.md
    - API documentation: reference/
    - Contributing: contributing.md
theme:
    name: material
    features:
        - navigation.tracking
        - content.code.annotate
        - content.code.copy
        - navigation.indexes
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          accent: purple
          toggle:
              icon: material/weather-sunny
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: black
          toggle:
              icon: material/weather-night
              name: Switch to light mode
repo_url: https://github.com/juftin/lunchmoney-mcp
repo_name: lunchmoney-mcp
edit_uri: blob/main/docs/
site_author: Justin Flannery
remote_branch: gh-pages
copyright: Copyright © 2026 Justin Flannery
extra:
    generator: false
exclude_docs: |
    gen_pages.py
markdown_extensions:
    - toc:
          permalink: "#"
    - pymdownx.snippets:
          base_path:
              - !relative $config_dir
    - pymdownx.magiclink
    - attr_list
    - sane_lists
    - md_in_html
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.superfences
    - pymdownx.keys
    - pymdownx.tasklist
    - pymdownx.tilde
    - callouts
    - pymdownx.details
    - pymdownx.emoji
    - pymdownx.tabbed:
          alternate_style: true
plugins:
    - search
    - markdown-exec
    - section-index
    - autorefs
    - mkdocstrings:
          handlers:
              python:
                  inventories:
                      - https://docs.python.org/3/objects.inv
                  options:
                      docstring_style: numpy
    - gen-files:
          scripts:
              - docs/gen_pages.py
    - literate-nav:
          nav_file: SUMMARY.md
